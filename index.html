<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020402" />
  <meta name="description" content="Семейный квест к годовщине" />
  <title>ACCESS: YEAR_01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="terminal-shell" aria-live="polite">
    <section class="screen" id="screen">

      <div class="terminal-body">

        <p class="kicker" id="kicker">SECURE CONNECTION ESTABLISHED</p>
        <h1 id="title">ГОД 01</h1>
        <div class="copy" id="copy"></div>
        <div class="answers" id="answers"></div>
        <button class="primary" id="nextBtn" type="button">НАЧАТЬ</button>
        <p class="hint" id="hint"></p>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
